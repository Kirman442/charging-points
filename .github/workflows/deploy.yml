        run: |
          import json, os, pathlib, shutil
          root = pathlib.Path('.')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'charging-pages'
          target.mkdir()
          for name in json.loads((root / 'release.json').read_text())['files']:
