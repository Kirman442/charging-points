name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run lint
          npm test

      - name: Build
        run: |
          if [ -z "$VITE_CARTO_BASEMAP_API_KEY" ]; then
            echo "::error::Set the CARTO_BASEMAP_API_KEY repository secret before publishing."
            exit 1
          fi
          npm run build
        env:
          CHARGING_REVIEW_KEY: ${{ secrets.CHARGING_REVIEW_KEY }}
          CHARGING_REVIEW_HASH: ${{ vars.CHARGING_REVIEW_HASH }}
          VITE_CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}

      - name: Verify release contents
        run: npm run preflight

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
